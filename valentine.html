<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Valentine Proposal</title>
    <style>
      img {
        width: 300px;
        margin-top: 20px;
      }

      body {
        text-align: center;
        background-color: pink;
        font-family: "Arial", sans-serif;
      }

      h1 {
        color: red;
        font-size: 2.5em;
        font:
          bold italic 2.5em "Comic Sans MS",
          cursive,
          sans-serif;
      }
      p {
        font:
          italic 1.5em "Comic Sans MS",
          sans-serif;
        font-size: 1.5em;
        text-align: center;
        max-width: 700px;
        margin: 20px auto;
      }

      button {
        display: inline-block;
        font-size: 1.2em;
        padding: 10px 20px;
        margin: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        gap: 20px;
      }

      #btn {
        background-color: lightgreen;
        transition:
          padding 0.3s ease,
          font-size 0.3s ease;
      }

      #btn2 {
        background-color: lightcoral;
      }
    </style>
  </head>
  <body>
    <div>
      <img src="img/firstgif.gif" alt="Bear holding flower" />
      <h1 className="title">Valentine proposal</h1>
      <p>maybe you want?</p>
    </div>
    <div>
      <button id="btn">Yes</button>
      <button id="btn2">No</button>
    </div>
  </body>
  <script>
    const yesBtn = document.getElementById("btn");
    const noBtn = document.getElementById("btn2");

    let noCount = 0;

    const getNoButtonText = () => {
      const phrases = [
        "No",
        "Sure ka?",
        "Sure na sure?",
        "Super sure ka?",
        "Luhhh",
        "Ayaw mo talagaaa?",
        "Come on, say yes na",
        "be your Valentine",
        "may I?",
        "heartbroken",
        "hurt na",
        "Tara na",
        "Ayaw mo ba talaga",
        "Sigi na",
        "luhhh, pls",
        "dali naaa",
        "Final na itu",
      ];

      return phrases[Math.min(noCount, phrases.length - 1)];
    };

    let paddingX = 20;
    let paddingY = 10;
    let fontSize = 1.2;

    noBtn.addEventListener("click", () => {
      noCount++;

      noBtn.textContent = getNoButtonText();

      paddingX += 10;
      paddingY += 5;
      fontSize += 0.2;

      yesBtn.style.padding = `${paddingY}px ${paddingX}px`;
      yesBtn.style.fontSize = `${fontSize}em`;
    });

    yesBtn.addEventListener("click", () => {
      window.location.href = "yes.html";
    });
  </script>
</html>
